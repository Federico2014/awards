name: Recommend a problem / 推荐题目
description: Recommend a solved problem for assessment under the current policy.
title: "[Problem] "
body:
  - type: markdown
    attributes:
      value: |
        Recommend a solved problem with public evidence. The current grading policy does not define an unsolved-problem listing or pricing process.
        请推荐有公开证据的已解决题目。现行评级制度不包含未解决题目的挂榜或定价流程。
        Do not include unconfirmed recipient names, private contact details, or payment information.
  - type: input
    id: problem
    attributes:
      label: Problem and original source / 题目及原始出处
      description: Give its identifier and a public source link.
    validations:
      required: true
  - type: textarea
    id: significance
    attributes:
      label: Statement and significance / 陈述与意义
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Resolution and verification evidence / 解决与核验证据
      description: Include public references, immutable proof source if available, and unresolved priority questions. Do not upload large logs.
    validations:
      required: true
  - type: textarea
    id: conflicts
    attributes:
      label: Related records and conflicts / 关联记录与利益冲突
      description: Link duplicates and state relevant public professional relationships, or write none.
    validations:
      required: true
